name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish self-contained single-file
        run: dotnet publish WallpaperRotator/WallpaperRotator.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish/sc

      - name: Publish framework-dependent
        run: dotnet publish WallpaperRotator/WallpaperRotator.csproj -c Release -r win-x64 --self-contained false -o publish/fw

      - name: Package assets
        run: |
          Copy-Item publish/sc/WallpaperRotator.exe WallpaperRotator-win-x64.exe
          Compress-Archive -Path publish/fw/* -DestinationPath WallpaperRotator-framework.zip

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            WallpaperRotator-win-x64.exe
            WallpaperRotator-framework.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}